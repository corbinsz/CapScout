[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["data", "features", "models", "evaluation", "tests", "backend", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/cities.py" = ["E402"]
"backend/app.py" = ["E402"]
"backend/services/data_service.py" = ["E402"]
"backend/services/prediction_service.py" = ["E402"]
"app/streamlit_app.py" = ["E402"]
"scripts/collect_calendars.py" = ["E402"]
"scripts/build_occupancy_labels.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
