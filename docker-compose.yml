services:
  capscout:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data/raw:/app/data/raw:ro
    command:
      - python
      - -m
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address
      - "0.0.0.0"
      - --server.port
      - "8501"
      - --browser.gatherUsageStats
      - "false"
