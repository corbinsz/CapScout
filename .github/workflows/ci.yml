name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check data features models evaluation tests backend app scripts
          black --check data features models evaluation tests backend app scripts
      - name: Download the three study snapshots
        run: python -m data.download austin san-diego seattle
      - name: Tests
        run: pytest
